# XcodeGen spec — reproducibly generates XauOrderPad.xcodeproj (with a scheme named "XauOrderPad",
# which the build-vm runbook's xcodebuild commands expect).
#
# Inside the macOS VM:  brew install xcodegen && cd ios && xcodegen generate
# Then open XauOrderPad.xcodeproj in Xcode, or build headless with xcodebuild.
#
# Prefer this over hand-authoring a .pbxproj. If you'd rather not use XcodeGen, the manual fallback
# is in ios/README.md (New SwiftUI App in Xcode → drag the XauOrderPad/ group in).

name: XauOrderPad
options:
  bundleIdPrefix: com.xauorderpad
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  XauOrderPad:
    type: application
    platform: iOS
    sources:
      - path: XauOrderPad
        excludes:
          - "App/Info.plist"   # referenced via INFOPLIST_FILE, not bundled as a resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xauorderpad.app
        PRODUCT_NAME: XauOrderPad
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: XauOrderPad/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SWIFT_VERSION: "5.0"
        # Unsigned build in CI/VM; Sideloadly signs at install time on Windows.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
